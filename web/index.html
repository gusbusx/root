<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Root — an interactive wellness and burnout-awareness app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Root">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Root</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f6f6f3;
    }
    body {
      min-height: 100vh;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2d3a2f;
      background: #f6f6f3;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Root…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
